# Static site served from the repo root; the chat API lives in netlify/functions/chat.mjs (/api/chat).
# netlify/functions/submission-created.mjs emails contact form submissions through Resend.
[build]
  publish = "."

# keep server-side source and tooling files from being served as static files
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true
